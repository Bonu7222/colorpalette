<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-top">
            <h1>Palette Pro 🎨</h1>
            <button id="format-btn">Switch to RGB</button>
        </div>
        <p>Press <strong>Spacebar</strong> or click Generate • Click<strong>🔒</strong> to lock a color</p>
    </header>

    <main id="palette" class="palette-container"></main>

    <button id="generate-btn">Generate New Palette</button>
    <div id="toast" class="toast">Copied to clipboard!</div>

    <script src="app.js"></script>
</body>
</html>
